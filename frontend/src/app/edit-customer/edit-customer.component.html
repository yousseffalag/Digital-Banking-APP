<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-0 pt-4 px-4">
          <h4 class="fw-bold mb-0">Edit Customer</h4>
          <p class="text-secondary small">Modify customer information</p>
        </div>
        <div class="card-body p-4">
          <form *ngIf="editCustomerFormGroup" [formGroup]="editCustomerFormGroup" (ngSubmit)="handleUpdateCustomer()">
            <div class="mb-4">
              <label class="form-label small fw-bold text-uppercase text-secondary">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" formControlName="name" class="form-control bg-light" placeholder="e.g. John Doe">
              </div>
              <div class="text-danger small mt-1"
                    *ngIf="editCustomerFormGroup.controls['name'].touched
                    && editCustomerFormGroup.controls['name'].errors
                    && editCustomerFormGroup.controls['name'].errors!['required']">
                <i class="bi bi-exclamation-circle me-1"></i> Name is required
              </div>
            </div>
            
            <div class="mb-4">
              <label class="form-label small fw-bold text-uppercase text-secondary">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="text" formControlName="email" class="form-control bg-light" placeholder="name@example.com">
              </div>
              <div class="text-danger small mt-1"
                    *ngIf="editCustomerFormGroup.controls['email'].touched
                    && editCustomerFormGroup.controls['email'].errors
                    && editCustomerFormGroup.controls['email'].errors!['email']">
                <i class="bi bi-exclamation-circle me-1"></i> Please enter a valid email address
              </div>
            </div>

            <div class="d-grid gap-2">
              <button [disabled]="!editCustomerFormGroup.valid" class="btn btn-primary py-3 fw-bold shadow-sm">
                <i class="bi bi-save me-2"></i> Update Customer
              </button>
              <button type="button" routerLink="/admin/customers" class="btn btn-light py-2 small">Cancel</button>
            </div>
          </form>
          
          <div *ngIf="!editCustomerFormGroup" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 text-secondary">Loading customer data...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
