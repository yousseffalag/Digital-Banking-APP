spring.config.import=optional:dotenv:./.env

spring.application.name=Chat-bot

# Use environment variables or a local .env file for your own keys.
# Copy Chat-bot/.env.example -> Chat-bot/.env and set values there.
spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.mistralai.chat.options.model=mistral-small-latest
spring.ai.mistralai.chat.options.temperature=0.7
spring.ai.mistralai.chat.options.max-tokens=1024
spring.ai.mistralai.embedding.options.model=mistral-embed

server.port=8087

telegram.api.key=${TELEGRAM_API_KEY}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:BankinAIBot}
backend.api.base-url=${BACKEND_API_BASE_URL:http://localhost:8085}